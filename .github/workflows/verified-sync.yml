name: Mirror signed SahamGorengan website artifacts
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verified-sync.yml'

permissions:
  contents: write
concurrency:
  group: sg-artifact-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install signature verifier
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Fetch and verify signed VPS snapshot
        env:
          SG_ORIGIN: https://dee-favors-netscape-nelson.trycloudflare.com/
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,time
          from pathlib import Path
          from urllib.request import Request,urlopen
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding

          origin=os.environ['SG_ORIGIN']
          allowed={
            'index.html','sg-intelligence.js','sg-intelligence.css',
            'data/sg-performance.json','data/sg-watchlist.json',
            'data/sg-status.json'
          }
          def get(url,limit=200000):
              req=Request(url,headers={'User-Agent':'SG-GitHub-Verified-Mirror/1.0','Cache-Control':'no-store'})
              with urlopen(req,timeout=22) as r:
                  if r.status!=200:raise ValueError(f'Origin HTTP {r.status}')
                  data=r.read(limit+1)
              if len(data)>limit:raise ValueError('Oversized artifact')
              return data
          raw=get(origin+'manifest.json',50000)
          envelope=json.loads(raw)
          message=base64.b64decode(envelope['payload'],validate=True)
          signature=base64.b64decode(envelope['signature'],validate=True)
          key=serialization.load_pem_public_key(Path('keys/sg-signing-public.pem').read_bytes())
          key.verify(signature,message,padding.PKCS1v15(),hashes.SHA256())
          manifest=json.loads(message)
          now=int(time.time())
          assert manifest.get('schema')==1
          assert now-10800<=int(manifest['epoch'])<=now+300
          assert now<int(manifest['expires'])<=now+11000
          assert set(manifest['files'])==allowed
          files={}
          for name in sorted(allowed):
              item=manifest['files'][name]
              content=get(origin+name)
              assert len(content)==int(item['bytes'])
              assert hashlib.sha256(content).hexdigest()==item['sha256']
              if name.endswith('.json'):
                  assert json.loads(content)['schema']==1
              files[name]=content
          folder=Path('public')
          for name,data in files.items():
              path=folder/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          (folder/'manifest.json').write_bytes(raw)
          print('VERIFIED',len(files),'artifacts',manifest['epoch'])
          PY
      - name: Atomically publish verified artifacts to Git
        run: |
          git config user.name "sg-verified-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Mirror verified public site artifacts"
            git push origin HEAD:main
          fi
